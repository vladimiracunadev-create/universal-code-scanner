name: universal_code_scanner
description: Lector, intérprete, generador e inventario seguro de códigos QR y barras.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  barcode_widget: 2.0.4
  cross_file: 0.3.5+4
  crypto: 3.0.7
  cryptography: 2.9.0
  cupertino_icons: 1.0.8
  excel: 4.0.6
  file_picker: 12.0.0-beta.7
  flutter_secure_storage: 10.3.1
  image_picker: 1.2.3
  local_auth: 3.0.2
  mobile_scanner: 7.4.0
  path_provider: 2.1.6
  pdfrx: 2.4.5
  sembast: 3.8.9+1
  sembast_web: 2.4.5+1
  share_plus: 13.3.0
  shared_preferences: 2.5.5
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
